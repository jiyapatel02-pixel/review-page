<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Us - 5 Star Rating</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f9f9f9; }
        .card { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .stars { font-size: 35px; color: #ffc107; margin-bottom: 15px; }
        textarea { width: 100%; height: 80px; margin: 10px 0; padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
        .btn { background: #4285F4; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; }
        .btn:hover { background: #357ae8; }
    </style>
</head>
<body>

<div class="card">
    <h2>How was your experience with us?</h2>
    <div class="stars">⭐⭐⭐⭐⭐</div>
    <p>Click the button below to copy the review and proceed:</p>
    
    <textarea id="reviewText">Amazing service! Highly recommended, very professional staff and best quality experience. ⭐⭐⭐⭐</textarea>
    
    <button class="btn" onclick="copyAndOpen()">Copy Review & Go to Google</button>
</div>

<script>
function copyAndOpen() {
    var copyText = document.getElementById("reviewText");
    copyText.select();
    copyText.setSelectionRange(0, 99999); 
    navigator.clipboard.writeText(copyText.value);
    
    alert("Review copied successfully! Now paste it on the Google page.");
    
    // Your Google Maps Review Link
    window.location.href = "https://maps.app.goo.gl/JiALu6VCWC2KM8hF8?g_st=ic";
}
</script>

</body>
</html>
