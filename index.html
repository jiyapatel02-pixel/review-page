<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Us - AI Review Generator</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px 20px; background: #f9f9f9; }
        .card { max-width: 400px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .stars { font-size: 35px; color: #ffc107; margin-bottom: 15px; }
        p { color: #555; font-size: 14px; margin-bottom: 20px; }
        textarea { width: 100%; height: 90px; margin: 15px 0; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; resize: none; box-sizing: border-box; }
        .btn-ai { background: #4285F4; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 10px; font-weight: bold; }
        .btn-ai:hover { background: #357ae8; }
        .btn-submit { background: #34A853; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-submit:hover { background: #2e8b57; }
    </style>
</head>
<body>

<div class="card">
    <h2>How was your experience?</h2>
    <div class="stars">⭐⭐⭐⭐⭐</div>
    <p>Click the button below to generate a 5-star review using AI.</p>
    
    <button class="btn-ai" onclick="generateReview()">✨ Generate AI Review</button>
    
    <textarea id="reviewText" placeholder="Your review will appear here..."></textarea>
    
    <button class="btn-submit" onclick="copyAndOpen()">Copy & Submit on Google</button>
</div>

<script>
const reviews = [
    "Amazing service! Highly recommended, very professional staff and best quality experience. ⭐⭐⭐⭐⭐",
    "Fantastic experience! The team is very polite, helpful, and provides top-notch quality service. ⭐⭐⭐⭐⭐",
    "Absolute best service! Completely satisfied and will definitely visit again. Great job! ⭐⭐⭐⭐⭐",
    "Very smooth and professional experience. Exceeded all my expectations! ⭐⭐⭐⭐⭐"
];

function generateReview() {
    const randomIndex = Math.floor(Math.random() * reviews.length);
    document.getElementById("reviewText").value = reviews[randomIndex];
}

function copyAndOpen() {
    var copyText = document.getElementById("reviewText");
    if (copyText.value.trim() === "" || copyText.value === "Your review will appear here...") {
        alert("Please click 'Generate AI Review' first!");
        return;
    }
    copyText.select();
    copyText.setSelectionRange(0, 99999); 
    navigator.clipboard.writeText(copyText.value);
    
    alert("Review copied! You will now be redirected to Google Maps. Just paste it there.");
    
    // Tamari Google Maps Review Link
    window.location.href = "https://maps.app.goo.gl/JiALu6VCWC2KM8hF8?g_st=ic";
}
</script>

</body>
</html>
