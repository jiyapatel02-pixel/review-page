<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Us - AI Review Generator</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; width: 100%; }
        button { background: #4285F4; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        button:hover { background: #357ae8; }
        textarea { width: 100%; height: 80px; margin-top: 10px; padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="card">
    <h2>Aamari Service Kem Lagi? ⭐⭐⭐⭐⭐</h2>
    <p>AI ni madad thi ek 5-star review generate karva mate niche na button par click karo.</p>
    
    <button onclick="generateAIReview()">✨ Generate AI Review</button>
    
    <br>
    <textarea id="reviewText" placeholder="Ahiya review aapse..."></textarea>
    <br>
    <button style="background: #34A853;" onclick="copyAndRedirect()">Copy & Submit on Google</button>
</div>

<script>
    function generateAIReview() {
        // Tamari business niche pramane automatic 5-star review comment
        const reviews = [
            "Best service and very friendly staff! Highly recommended for everyone. 5 stars!",
            "Amazing experience! Quality work and great customer support. Will visit again.",
            "Superb service, very professional and fast response. Completely satisfied!"
        ];
        
        // Randomly ek review select karse
        const randomReview = reviews[Math.floor(Math.random() * reviews.length)];
        document.getElementById('reviewText').value = randomReview;
    }

    function copyAndRedirect() {
        const reviewBox = document.getElementById('reviewText');
        reviewBox.select();
        document.execCommand('copy');
        
        alert("Review copy thai gyo che! Have Google page par paste karo.");
        
        // Tamara Google Maps/Review ni link (Tamari aapele link)
        window.location.href = "https://maps.app.goo.gl/JiALu6VCWC2KM8hF8?g_st=ic";
    }
</script>

</body>
</html>
